name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Run the tests
        run: npx vitest run
      - name: Type-check the engine and scripts
        run: npx tsc --noEmit -p .
      - name: Type-check the web app
        run: npx tsc --noEmit -p web
      - name: Type-check the web tests (Node types allowed there, never in the web app)
        run: npx tsc --noEmit -p tests/ts/web
      - run: npm run build
      - name: Refuse any resource loaded from another site
        run: node scripts/check-dist.ts web/dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
